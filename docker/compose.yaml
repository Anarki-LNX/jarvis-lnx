# NuOrb-Server – Installation: .env.example nach .env kopieren, anpassen, dann `docker compose up -d`.
# Details: README.md
name: nuorb

services:
  nuorb:
    container_name: nuorb
    # Fertiges Image von GitHub (amd64/arm64). Ist es (noch) nicht abrufbar, baut Compose es aus diesem Ordner.
    image: ghcr.io/anarki-lnx/nuorb:${NUORB_VERSION:-latest}
    build:
      context: .
      args:
        NUORB_BUILD: ${NUORB_BUILD:-dev}
    pull_policy: missing
    restart: unless-stopped
    # Härtung: keine zusätzlichen Rechte zur Laufzeit, nur die Fähigkeiten, die s6 beim Start braucht (Besitz setzen,
    # zum Nutzer hermes wechseln, Dienste beenden). Die NuOrb-Dienste selbst laufen als hermes, nicht als root.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    pids_limit: 2048          # gemessen im e2e-Lauf: höchstens ~300 Prozesse
    # Speichergrenze: gemessen höchstens ~1,5 GB (Sprache, Hermes, Smart Home). 4 GB lassen Luft für erweiterte
    # Werkzeuge mit Browser. Eigener Wert in der .env: NUORB_MEM_LIMIT=6g. Keine feste CPU-Grenze (Spracherkennung
    # braucht kurze Spitzen über mehrere Kerne).
    mem_limit: ${NUORB_MEM_LIMIT:-4g}
    # Ab v0.7.2: Dateisystem des Images schreibgeschützt. Geschrieben wird nur in die Volumes (data, models) und in
    # die tmpfs-Bereiche unten (Laufzeitdateien von s6, Zwischendateien). Getestet mit dem ganzen e2e-Lauf.
    read_only: true
    tmpfs:
      - /run:exec,mode=0755,size=64m
      - /tmp:mode=1777,size=512m
      - /var/tmp:mode=1777,size=64m
    healthcheck:
      test: ["CMD", "/opt/nuorb/bin/healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    env_file: .env
    # Optional: Ollama auf demselben Rechner als http://host.docker.internal:11434 ansprechen. Nicht standardmäßig an:
    # Ohne Standard-Bridge docker0 (z. B. "bridge": "none" in daemon.json) startet der Container damit nicht.
    # Einfacher ist die IP des Rechners. Bei Bedarf die nächste Zeile aktivieren:
    # extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      # Nur im Heimnetz/VPN nutzen – diese Ports NICHT im Router ins Internet freigeben.
      - "${NUORB_BIND:-0.0.0.0}:${NUORB_UI_PORT_PUBLIC:-8443}:8443"    # Oberfläche + App-API
      - "${NUORB_BIND:-0.0.0.0}:${NUORB_ADMIN_PORT_PUBLIC:-8444}:8444" # Admin-Panel
    volumes:
      - data:/opt/data        # Konfiguration, Schlüssel, Gedächtnis, Sitzungen, Zertifikate
      - models:/opt/models    # Stimmen und Spracherkennungs-Modell (beim ersten Start geladen)
      # Ab v0.7.3: Austausch mit der Update-Hilfe auf dem Rechner (install.sh). Das Panel schreibt nur eine
      # Anforderung nach control/request/, die Hilfe Status und Protokoll nach control/status/.
      - ./control:/opt/nuorb/control
      # Eigenes Zertifikat (NUORB_TLS=custom): Ordner mit fullchain.pem + privkey.pem einbinden
      # - ./certs:/certs:ro
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional: eigenes Ollama im selben Compose-Projekt (`docker compose --profile ollama up -d`).
  # Dann in der .env NUORB_INIT_OLLAMA_URL=http://ollama:11434 setzen. Ohne GPU-Freigabe läuft es auf der CPU (langsam).
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.18}
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "65536"   # Hermes verlangt mindestens 64k Kontext
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - ollama:/root/.ollama
    # GPU (NVIDIA, Container-Toolkit nötig) – Kommentar entfernen:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

# Feste Volume-Namen: Installationen bis v0.3.x (Projekt „nuorb“) nutzen ihre Daten weiter, auch neue
# Installationen bekommen diese Namen. Nicht ändern, sonst startet NuOrb mit leeren Daten.
volumes:
  data:
    name: nuorb_data
  models:
    name: nuorb_models
  ollama:
    name: nuorb_ollama
