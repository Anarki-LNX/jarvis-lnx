<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>NuOrb · Pair</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tokens.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #0b1a22, var(--bg-0) 60%);
         color: var(--text); font-family: Inter, system-ui, sans-serif; }
  .card { width: min(92vw, 420px); padding: 32px 28px; border: 1px solid var(--line-strong); border-radius: var(--radius);
          background: var(--panel); box-shadow: 0 0 60px rgba(56, 217, 255, .08); }
  h1 { font-family: "Space Grotesk", sans-serif; letter-spacing: .3em; font-weight: 600; margin: 0 0 4px; color: var(--cyan-soft); }
  p { color: var(--text-2); line-height: 1.5; }
  input { width: 100%; box-sizing: border-box; font: 600 26px "JetBrains Mono", monospace; letter-spacing: .15em; text-align: center;
          padding: 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--bg-2); color: var(--text); text-transform: uppercase; }
  button { margin-top: 16px; width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--cyan); color: #00141c;
           font: 600 16px Inter, sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; }
  .err { color: var(--red); min-height: 1.4em; }
  .small { font-size: 13px; color: var(--text-3); }
</style>
</head>
<body>
<main class="card">
  <h1>NuOrb</h1>
  <p id="lead">This device is not paired yet. Open <b>Pair device</b> in the admin panel and enter the code – or scan the QR code there.</p>
  <form id="f" autocomplete="off">
    <input id="code" name="code" inputmode="text" maxlength="9" placeholder="XXXX-XXXX" aria-label="Pairing code" spellcheck="false">
    <button id="go" type="submit">Pair</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="small" id="hint">The code is valid for 10 minutes and only once.</p>
</main>
<script src="/pair.js"></script>
</body>
</html>
