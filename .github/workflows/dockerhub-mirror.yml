# Copies an already published image from ghcr.io to Docker Hub without rebuilding it
# (all architectures, same digest). Used once for releases built before Docker Hub was added.
name: dockerhub-mirror
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to copy, e.g. 0.6.6"
        required: true
      latest:
        description: "Also set :latest on Docker Hub"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: anarkilnx
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid version"; exit 1; }
          src="ghcr.io/anarki-lnx/nuorb:$VERSION"
          tags=(-t "docker.io/anarkilnx/nuorb:$VERSION")
          [ "$LATEST" = "true" ] && tags+=(-t docker.io/anarkilnx/nuorb:latest)
          docker buildx imagetools create "${tags[@]}" "$src"
          docker buildx imagetools inspect "docker.io/anarkilnx/nuorb:$VERSION" | head -20
