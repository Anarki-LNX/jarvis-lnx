# Gehört ins öffentliche Repo nach .github/workflows/docker.yml (Build-Kontext: docker/).
# Baut bei einem Tag v* das Image für amd64 und arm64 und veröffentlicht es als
#   ghcr.io/<owner>/nuorb:<version>  und  :latest
# und zusätzlich auf Docker Hub als docker.io/anarkilnx/nuorb (Secret DOCKERHUB_TOKEN).
name: docker
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  # Erst Unit-Tests, Linter und End-to-End-Test (tests.yml), dann bauen und veröffentlichen
  tests:
    uses: ./.github/workflows/tests.yml
  image:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Privatsphäre-Prüfung der Quellen (generisch)
        run: |
          if grep -rnE '\b192\.168\.[0-9]+\.[0-9]+\b[^/0-9]|sk-ant-[A-Za-z0-9]|BEGIN [A-Z ]*PRIVATE KEY' docker/src docker/app | grep -vE '192\.168\.1\.50\b'; then
            echo "Private Werte gefunden – Abbruch"; exit 1
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: docker.io
          username: anarkilnx
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/nuorb
            docker.io/anarkilnx/nuorb
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUORB_BUILD=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
