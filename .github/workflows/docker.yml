# Gehört ins öffentliche Repo nach .github/workflows/docker.yml (Build-Kontext: docker/).
# Baut bei einem Tag v* das Image für amd64 und arm64 und veröffentlicht es als
#   ghcr.io/<owner>/nuorb:<version>  und  :latest
# und zusätzlich auf Docker Hub als docker.io/anarkilnx/nuorb (Secret DOCKERHUB_TOKEN).
name: docker
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  # Erst Unit-Tests, Linter und End-to-End-Test (tests.yml), dann bauen und veröffentlichen
  tests:
    uses: ./.github/workflows/tests.yml
  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write     # SBOM an das Release hängen
      packages: write
      id-token: write     # Attestierung des Images
      attestations: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Privatsphäre-Prüfung der Quellen (generisch)
        run: |
          if grep -rnE '\b192\.168\.[0-9]+\.[0-9]+\b[^/0-9]|sk-ant-[A-Za-z0-9]|BEGIN [A-Z ]*PRIVATE KEY' docker/src docker/app | grep -vE '192\.168\.1\.50\b'; then
            echo "Private Werte gefunden – Abbruch"; exit 1
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: docker.io
          username: anarkilnx
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/nuorb
            docker.io/anarkilnx/nuorb
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Erst amd64 lokal bauen und prüfen, dann veröffentlichen: kritische Lücken mit verfügbarer Korrektur stoppen das Release
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: docker
          platforms: linux/amd64
          load: true
          tags: nuorb:scan
          build-args: |
            NUORB_BUILD=${{ steps.meta.outputs.version }}
          cache-from: type=gha
      - name: Image scan (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: nuorb:scan
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: table
      - name: License check (NuOrb venv, new copyleft or unknown licenses stop the release)
        run: |
          docker run --rm --entrypoint cat nuorb:scan /usr/share/doc/nuorb/python-packages.tsv | python3 docker/tools/license-check.py
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: nuorb:scan
          format: spdx-json
          output-file: nuorb-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUORB_BUILD=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the image (provenance in GHCR, check with gh attestation verify)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/anarki-lnx/nuorb
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attach the SBOM to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # release-files.yml legt den Entwurf an; kurz warten, falls er noch fehlt
          for i in $(seq 1 30); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 10; done
          gh release upload "$TAG" --clobber nuorb-sbom.spdx.json
